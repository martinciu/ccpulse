name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Check coverage threshold
        env:
          THRESHOLD: 70
        run: |
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          if [ -z "$pct" ]; then
            echo "::error::Could not parse coverage total from coverage.out"
            exit 1
          fi
          case "$pct" in
            *[!0-9.]*)
              echo "::error::Malformed coverage value: '$pct' (expected numeric)"
              exit 1
              ;;
          esac
          echo "Coverage: ${pct}% (threshold: ${THRESHOLD}%)"
          awk -v p="$pct" -v t="$THRESHOLD" 'BEGIN { exit !(p+0 >= t) }'

  lint:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: v2.11.4

  vulncheck:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      # Pinned, not @latest: this job runs with GOTOOLCHAIN=local on the Go
      # version from go.mod, so a govulncheck whose own go directive is NEWER
      # than ours cannot be resolved and the job dies before scanning anything.
      # x/vuln v1.8.0 moved to `go 1.26.0` and broke every PR that way; v1.7.0
      # is the last release on `go 1.25.0`.
      #
      # When bumping: the new version's go directive must be <= the go directive
      # in go.mod. Don't "fix" a failure here by letting the toolchain float —
      # scanning under a newer Go reports that Go's stdlib advisories, not the
      # one the release binaries are actually built with.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
